<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>四上语文·课间闯关乐园</title>
<style>
:root{--ink:#263b35;--green:#315d4b;--mint:#e9f2e8;--gold:#c69a4b;--paper:#fffdf6;--line:#d9e4d8;--red:#b45b4c}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#e7efe4,#f7f0df);font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);min-height:100vh}
header{padding:18px 24px;text-align:center;background:linear-gradient(110deg,#244c40,#47765e);color:#fff;border-bottom:5px solid #d6b66d}
h1{margin:0;font-size:clamp(24px,4vw,40px);letter-spacing:3px}.sub{margin-top:7px;color:#e8eadb;font-size:14px}
.wrap{max-width:1100px;margin:20px auto;padding:0 18px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
select,button{font:inherit;border:0;border-radius:12px;padding:12px 16px}
select{background:#fff;border:1px solid var(--line);color:var(--ink)}
button{cursor:pointer;background:var(--green);color:white;font-weight:700;box-shadow:0 3px 0 #234638}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #234638}
button.secondary{background:#b98b43;box-shadow:0 3px 0 #8f682f}
button.light{background:#edf4ea;color:var(--green);border:1px solid #cfdfce;box-shadow:none}
.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:10px 0 18px}
.pill{background:#fffdf6;border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-weight:700}
.card{background:var(--paper);border:2px solid #d9c99e;border-radius:22px;padding:clamp(18px,4vw,34px);box-shadow:0 12px 30px #284d3518;max-width:900px;margin:auto;position:relative}
.ribbon{color:#a77c37;font-weight:800;letter-spacing:2px;font-size:14px}
.question{font-size:clamp(21px,3vw,30px);font-weight:800;line-height:1.55;margin:18px 0 24px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:#f0f5ed;color:var(--ink);box-shadow:none;border:2px solid #dce8d9;text-align:left;min-height:64px;font-size:18px}
.opt:hover{background:#e3efdf}.opt.correct{background:#d8efdc;border-color:#4d9b62;color:#205a30}.opt.wrong{background:#f8e3df;border-color:#c97869;color:#8e3429}
.feedback{display:none;margin-top:18px;padding:16px;border-radius:14px;background:#f3f0e3;line-height:1.7;font-size:17px}
.feedback.show{display:block}.feedback strong{color:var(--green)}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.progress{height:9px;background:#e6eadf;border-radius:20px;overflow:hidden;margin:0 auto 18px;max-width:900px}.bar{height:100%;width:0;background:linear-gradient(90deg,#6c9a6d,#d2ad60);transition:width .25s}
.start{text-align:center;padding:30px 10px}.start h2{font-size:28px}.start p{font-size:17px;line-height:1.8;color:#53665a}
.small{font-size:13px;color:#68786d;text-align:center;margin:16px}
.hidden{display:none!important}
@media(max-width:650px){.options{grid-template-columns:1fr}.opt{min-height:54px}.wrap{padding:0 10px}}
</style>
</head>
<body>
<header><h1>四上语文 · 课间闯关乐园</h1><div class="sub">国风书院 · 前六单元复习 · 轮流挑战 · 即答即讲</div></header>
<div class="wrap">
 <div class="toolbar">
  <select id="scope"><option value="all">全部范围（前六单元＋必读书目）</option><option value="1">第一单元</option><option value="2">第二单元</option><option value="3">第三单元</option><option value="4">第四单元</option><option value="5">第五单元</option><option value="6">第六单元</option><option value="book">必读书目专项</option><option value="base">基础知识专项</option></select>
  <select id="round"><option value="10">每轮10题</option><option value="5">每轮5题</option><option value="15">每轮15题</option><option value="20">每轮20题</option></select>
  <button id="startBtn">开始闯关</button>
  <button class="light" id="resetBtn">重新开始本轮</button>
 </div>
 <div class="stats"><div class="pill">题库 <span id="total">180</span> 题</div><div class="pill">本轮 <span id="num">0/10</span></div><div class="pill">答对 <span id="score">0</span></div><div class="pill">当前积分 <span id="points">0</span></div></div>
 <div class="progress"><div class="bar" id="bar"></div></div>
 <section class="card">
  <div id="welcome" class="start">
   <div class="ribbon">CLASSROOM QUIZ · 一起闯关</div>
   <h2>准备好了吗？</h2>
   <p>适合教室大屏轮流挑战。<br>选单元或专项，点击开始后随机抽题。<br>答对加分；答错公布答案，其他同学可以补答。<br><b>不记录个人错题，不需要登录。</b></p>
   <button id="startBig" class="secondary">现在开始</button>
  </div>
  <div id="play" class="hidden">
   <div class="ribbon" id="label">第一单元 · 基础知识</div>
   <div class="question" id="question"></div>
   <div class="options" id="options"></div>
   <div class="feedback" id="feedback"></div>
   <div class="actions">
    <button id="next" class="secondary" disabled>下一题</button>
    <button id="show" class="light">公布答案</button>
   </div>
  </div>
  <div id="finish" class="start hidden">
   <div class="ribbon">ROUND COMPLETE</div><h2>本轮闯关完成！</h2>
   <p id="result"></p>
   <button id="again">再来一轮</button>
  </div>
 </section>
 <div class="small">课堂使用提示：可由学生轮流上台作答；也可按小组累计本轮积分。题目按所选范围随机抽取。</div>
</div>

const BANK = [{"unit": 1, "cat": "课文", "q": "《观潮》描写的是哪一处大潮？", "opts": ["钱塘江大潮", "黄河大潮", "长江大潮", "珠江大潮"], "a": 0, "why": "课文描写钱塘江大潮的壮观景象。"}, {"unit": 1, "cat": "课文", "q": "《观潮》按什么顺序描写潮水？", "opts": ["潮来前、潮来时、潮头过后", "事情起因、经过、结果", "由远及近再倒叙", "春夏秋冬"], "a": 0, "why": "课文按时间顺序描写潮来前、潮来时和潮头过后的景象。"}, {"unit": 1, "cat": "词语", "q": "“人声鼎沸”形容什么？", "opts": ["十分安静", "人很少", "声音悦耳动听", "人声嘈杂热闹"], "a": 3, "why": "鼎沸原指锅中水沸腾，形容人声喧闹。"}, {"unit": 1, "cat": "词语", "q": "“山崩地裂”最适合形容？", "opts": ["动作轻巧", "天气温和", "十分安静", "声势巨大"], "a": 3, "why": "山崩地裂形容声势或变化十分巨大。"}, {"unit": 1, "cat": "词语", "q": "“风平浪静”的反义词是？", "opts": ["风和日丽", "水平如镜", "波涛汹涌", "鸦雀无声"], "a": 2, "why": "风平浪静与波涛汹涌意思相反。"}, {"unit": 1, "cat": "写法", "q": "观察事物，除了观察静态，还要留意什么？", "opts": ["产地", "价格", "变化", "名称"], "a": 2, "why": "细致观察要关注事物的变化。"}, {"unit": 1, "cat": "字音", "q": "“薄雾”的“薄”读音是？", "opts": ["bō", "bò", "bó", "báo"], "a": 2, "why": "薄雾读 bó；薄片常读 báo。"}, {"unit": 1, "cat": "字音", "q": "“霎时”的“霎”读音是？", "opts": ["chà", "sà", "xiá", "shà"], "a": 3, "why": "霎时读 shà shí。"}, {"unit": 1, "cat": "词语", "q": "“浩浩荡荡”常用来形容？", "opts": ["声音微弱", "颜色单一", "水势大或队伍声势大", "动作缓慢"], "a": 2, "why": "浩浩荡荡形容水势广阔或声势浩大。"}, {"unit": 1, "cat": "字音", "q": "“昂首东望”的“昂”读音是？", "opts": ["àng", "áng", "yáng", "ǎng"], "a": 1, "why": "昂读 áng，昂首就是抬起头。"}, {"unit": 2, "cat": "课文", "q": "《走月亮》写“我”和谁一起走月亮？", "opts": ["阿妈", "奶奶", "老师", "伙伴"], "a": 0, "why": "课文写“我”和阿妈在月光下散步。"}, {"unit": 2, "cat": "课文", "q": "《走月亮》中反复出现的句子是？", "opts": ["我和阿妈走月亮", "潮来了", "爬山虎的脚", "蟋蟀的住宅"], "a": 0, "why": "反复出现“我和阿妈走月亮”，富有韵味。"}, {"unit": 2, "cat": "词语", "q": "“坑坑洼洼”形容什么？", "opts": ["声音响亮", "地面高低不平", "颜色鲜艳", "十分平坦"], "a": 1, "why": "坑坑洼洼形容地面不平整。"}, {"unit": 2, "cat": "词语", "q": "“逐渐”的近义词是？", "opts": ["立刻", "从不", "渐渐", "突然"], "a": 2, "why": "逐渐与渐渐意思相近。"}, {"unit": 2, "cat": "语文园地", "q": "阅读时可以从哪些角度提出问题？", "opts": ["只问页码", "只问字数", "文章内容、写法、联系生活经验", "只问作者年龄"], "a": 2, "why": "可以针对内容、写法和生活经验提问。"}, {"unit": 2, "cat": "语文园地", "q": "“那条狗高兴的时候叫，紧张的时候叫，发怒的时候也叫。”主要运用了？", "opts": ["反问", "夸张", "排比", "比喻"], "a": 2, "why": "三个结构相似的分句构成排比。"}, {"unit": 2, "cat": "日积月累", "q": "“好问则裕，自用则小”告诉我们要？", "opts": ["只相信自己", "拒绝交流", "善于提问、虚心请教", "不懂装懂"], "a": 2, "why": "善于提问、听取意见，见识会更广。"}, {"unit": 2, "cat": "字形", "q": "“鹅卵石”的“卵”正确写法是？", "opts": ["卵", "卬", "卯", "柳"], "a": 0, "why": "注意“卵”的字形，不要写成“卯”。"}, {"unit": 2, "cat": "词语", "q": "“风俗”的“俗”读音是？", "opts": ["sǔ", "zú", "sú", "shú"], "a": 2, "why": "风俗读 fēng sú。"}, {"unit": 2, "cat": "表达", "q": "把几个结构相似的句子排列在一起，可以起到什么作用？", "opts": ["表示疑问", "改变词义", "减少字数", "增强语势"], "a": 3, "why": "排比能增强语势，突出表达内容。"}, {"unit": 3, "cat": "课文", "q": "《爬山虎的脚》主要介绍了什么？", "opts": ["潮水变化", "蟋蟀唱歌", "小鸟筑巢", "叶子和脚的特点及攀爬过程"], "a": 3, "why": "课文介绍爬山虎叶子、脚的特点和向上爬的过程。"}, {"unit": 3, "cat": "课文", "q": "《蟋蟀的住宅》把蟋蟀的巢穴称作什么？", "opts": ["城堡", "宫殿", "住宅", "洞府"], "a": 2, "why": "课文把蟋蟀的巢穴称作住宅。"}, {"unit": 3, "cat": "观察", "q": "观察爬山虎的脚，作者重点写了？", "opts": ["位置、形状、颜色和变化", "生长地点的名称", "价格和味道", "声音大小"], "a": 0, "why": "作者细致观察，写出脚的特点和变化。"}, {"unit": 3, "cat": "写法", "q": "《蟋蟀的住宅》把蟋蟀当作人来写，主要运用了？", "opts": ["排比", "拟人", "夸张", "反问"], "a": 1, "why": "赋予蟋蟀人的行为，是拟人写法。"}, {"unit": 3, "cat": "词语", "q": "“均匀”的“均”读音是？", "opts": ["jùn", "yún", "yǔn", "jūn"], "a": 3, "why": "均匀读 jūn yún。"}, {"unit": 3, "cat": "词语", "q": "“引人注意”的意思是？", "opts": ["使人困倦", "引起别人的注意", "让人离开", "让人害怕"], "a": 1, "why": "指引起别人的注意。"}, {"unit": 3, "cat": "词语", "q": "“慎重”的近义词是？", "opts": ["粗心", "谨慎", "急忙", "随便"], "a": 1, "why": "慎重与谨慎意思相近。"}, {"unit": 3, "cat": "词语", "q": "“随遇而安”更接近哪种意思？", "opts": ["不愿生活", "总想改变环境", "能适应各种环境", "十分紧张"], "a": 2, "why": "指能适应环境，在任何境遇中都能满足。"}, {"unit": 3, "cat": "日积月累", "q": "“不识庐山真面目，只缘身在此山中”说明？", "opts": ["要走得快", "庐山很高", "山上没有风景", "观察角度不同，认识可能不同"], "a": 3, "why": "身处其中容易看不全面，要从不同角度观察。"}, {"unit": 3, "cat": "观察", "q": "连续观察最重要的是？", "opts": ["持续记录事物的变化", "凭想象描写", "只观察一次", "只听别人说"], "a": 0, "why": "连续观察能发现事物变化过程。"}, {"unit": 4, "cat": "课文", "q": "《精卫填海》中的精卫原来是谁？", "opts": ["黄帝", "后羿", "夸父", "炎帝的小女儿女娃"], "a": 3, "why": "精卫原是炎帝的小女儿女娃。"}, {"unit": 4, "cat": "课文", "q": "精卫填海时衔来什么？", "opts": ["金银珠宝", "西山的木石", "粮食", "鲜花"], "a": 1, "why": "精卫衔西山之木石，投入东海。"}, {"unit": 4, "cat": "寓意", "q": "精卫填海表现了怎样的精神？", "opts": ["骄傲自大", "贪图享乐", "胆小怕事", "坚持不懈"], "a": 3, "why": "表现了坚韧执着、永不放弃的精神。"}, {"unit": 4, "cat": "课文", "q": "《普罗米修斯》中，普罗米修斯为人类做了什么？", "opts": ["治理洪水", "射下太阳", "创造文字", "盗取火种"], "a": 3, "why": "普罗米修斯为人类盗取火种。"}, {"unit": 4, "cat": "人物", "q": "《普罗米修斯》中，惩罚普罗米修斯的神是？", "opts": ["宙斯", "阿波罗", "雅典娜", "赫拉"], "a": 0, "why": "宙斯命令惩罚普罗米修斯。"}, {"unit": 4, "cat": "人物", "q": "解救普罗米修斯的英雄是？", "opts": ["大禹", "后羿", "夸父", "赫拉克勒斯"], "a": 3, "why": "赫拉克勒斯射死鹫鹰，解救了普罗米修斯。"}, {"unit": 4, "cat": "课文", "q": "《女娲补天》中女娲炼制什么补天？", "opts": ["五色石", "木板", "水晶", "金子"], "a": 0, "why": "女娲炼五色石补天。"}, {"unit": 4, "cat": "课文", "q": "《盘古开天地》中盘古的身体后来化为？", "opts": ["一棵大树", "世间万物", "一座宫殿", "一条大河"], "a": 1, "why": "神话想象盘古身体化为天地万物。"}, {"unit": 4, "cat": "神话知识", "q": "神话故事通常具有怎样的特点？", "opts": ["丰富想象，表达古人对世界的认识", "完全记录真实历史", "只写日常生活", "没有人物"], "a": 0, "why": "神话充满想象，反映古人对世界的认识和愿望。"}, {"unit": 4, "cat": "神话知识", "q": "中国古代神话最初主要通过什么传播？", "opts": ["口耳相传", "网络", "报纸", "电视"], "a": 0, "why": "神话最初在民间口耳相传，后来被记录整理。"}, {"unit": 5, "cat": "写作", "q": "写一件事，通常要写清楚哪三个部分？", "opts": ["标题、作者、页码", "地点、声音、动作", "起因、经过、结果", "人物、颜色、天气"], "a": 2, "why": "写事要交代起因、经过和结果。"}, {"unit": 5, "cat": "写作", "q": "写事情时，时间、地点、人物要怎样？", "opts": ["只写一个", "交代明白", "随意安排", "全部省略"], "a": 1, "why": "时间、地点、人物等要素要交代清楚。"}, {"unit": 5, "cat": "写作", "q": "按一定顺序写事情，能让文章？", "opts": ["内容混乱", "条理清楚", "句子更短", "没有重点"], "a": 1, "why": "按事情发展顺序写，文章更有条理。"}, {"unit": 5, "cat": "写作", "q": "写活动场面，可以写看到的、听到的，还可以写什么？", "opts": ["天气预报", "作者年龄", "想到的", "价格"], "a": 2, "why": "可以从看到、听到、想到等方面描写。"}, {"unit": 5, "cat": "词语", "q": "“霎时”表示时间？", "opts": ["每天", "很长", "不确定", "很短"], "a": 3, "why": "霎时表示极短的时间。"}, {"unit": 5, "cat": "词语", "q": "“顿时”的意思是？", "opts": ["立刻", "经常", "昨天", "慢慢地"], "a": 0, "why": "顿时表示立刻、马上。"}, {"unit": 5, "cat": "写作", "q": "描写比赛场面，写出人物动作和观众反应，能使场面？", "opts": ["没有变化", "更简短", "更模糊", "更具体生动"], "a": 3, "why": "动作、语言和场面反应能让描写更生动。"}, {"unit": 5, "cat": "表达", "q": "人物直接说的话，通常要使 let deck=[],index=0,score=0,answered=false,current=null;
const $=id=>document.getElementById(id);
function filtered(){
 const s=$('scope').value;
 return BANK.filter(x=>s==='all'||(s==='book'?x.cat==='必读书目':s==='base'?x.cat!=='必读书目':String(x.unit)===s));
}
function begin(){
 const pool=filtered();
 if(!pool.length){alert('这个范围暂时没有题目');return}
 deck=pool.slice().sort(()=>Math.random()-.5).slice(0,Math.min(+$('round').value,pool.length));
 index=0;score=0;$('score').textContent=0;$('points').textContent=0;
 $('welcome').classList.add('hidden');$('finish').classList.add('hidden');$('play').classList.remove('hidden');showQ();
}
function showQ(){
 current=deck[index];answered=false;
 $('num').textContent=(index+1)+'/'+deck.length;
 $('bar').style.width=(index/deck.length*100)+'%';
 $('label').textContent=(current.unit?'第'+current.unit+'单元':'拓展专项')+' · '+current.cat;
 $('question').textContent=(index+1)+'. '+current.q;
 $('feedback').className='feedback';$('feedback').innerHTML='';
 $('next').disabled=true;
 $('options').innerHTML='';
 current.opts.forEach((o,i)=>{
  const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+i)+'．'+o;
  b.onclick=()=>choose(i,b);$('options').appendChild(b);
 });
}
function choose(i,btn){
 if(answered)return;
 answered=true;
 const buttons=[...$('options').children];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===current.a)b.classList.add('correct')});
 if(i===current.a){score++;$('score').textContent=score;$('points').textContent=score*10;feedback(true)}
 else{btn.classList.add('wrong');feedback(false)}
 $('next').disabled=false;
}
function feedback(ok){
 $('feedback').className='feedback show';
 $('feedback').innerHTML=(ok?'🎉 <strong>答对了！+10分</strong>':'💡 <strong>再记一记正确答案：</strong>')+
 '<br>正确答案：'+current.opts[current.a]+'<br>解析：'+current.why;
}
function reveal(){
 if(answered)return;
 answered=true;
 [...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===current.a)b.classList.add('correct')});
 feedback(false);$('next').disabled=false;
}
function next(){
 if(!answered)return;
 index++;
 if(index>=deck.length){$('play').classList.add('hidden');$('finish').classList.remove('hidden');$('bar').style.width='100%';$('result').textContent='本轮共 '+deck.length+' 题，答对 '+score+' 题，获得 '+score*10+' 分。可以换一组同学继续挑战！';}
 else showQ();
}
$('startBtn').onclick=begin;$('startBig').onclick=begin;$('again').onclick=begin;$('next').onclick=next;$('show').onclick=reveal;
